[workspace]
resolver = "3"
members = ["crates/engine", "crates/sound", "crates/content", "crates/game-native", "crates/emu", "crates/extract", "crates/studio", "crates/explore", "crates/parity", "crates/vanilla", "xtask"]
exclude = ["crates/game-gba"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
engine = { path = "crates/engine" }
sound = { path = "crates/sound" }
content = { path = "crates/content" }
game-native = { path = "crates/game-native" }
emu = { path = "crates/emu" }
extract = { path = "crates/extract" }
studio = { path = "crates/studio" }
explore = { path = "crates/explore" }
parity = { path = "crates/parity" }
anyhow = "1"
mgba = "0.1.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

# Studio decision 13: the native game in debug builds runs at about 5 ms per frame (too slow
# for fast-forward and seeks); optimize the game crates even in dev builds.
# Host release builds are incremental (parity plan, 2026-10-23): an engine edit rebuilds engine
# and content in ~7 s instead of ~2 min (content's generated scripts, one mostly single-threaded
# rustc). Host-only: the ROM is built by crates/game-gba, its own workspace and profile.
[profile.release]
incremental = true

[profile.dev.package.engine]
opt-level = 2

[profile.dev.package.game-native]
opt-level = 2

# The extract and studio tests decode, re-encode and export the whole ROM (explorer and gate
# speed work): optimized, with the image and data crates they lean on, their slowest test
# binaries take 3x to 10x less CPU (extract's export 149 s to 27 s, studio's map_edit 55 s to
# 5 s), for about two more minutes of build when these crates rebuild.
[profile.dev.package.extract]
opt-level = 2

[profile.dev.package.studio]
opt-level = 2

[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.crc32fast]
opt-level = 2

[profile.dev.package.adler2]
opt-level = 2

[profile.dev.package.simd-adler32]
opt-level = 2

[profile.dev.package.ron]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

# The content build script generates the data and the scripts (Milestone 8): optimized, it runs
# 7x faster than at opt-level 0.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

# The content crate holds every generated script (Milestone 8 Task D2): line tables only take
# ~0.9 GB off its native debug build on the full import.
[profile.dev.package.content]
debug = "line-tables-only"
