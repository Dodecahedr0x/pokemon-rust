[package]
name = "content"
edition.workspace = true
version.workspace = true
publish.workspace = true
build = "build/main.rs"
# The build script tells its direct dependents which flavour it built (`cargo::metadata=flavor=…`,
# their `DEP_PKR_CONTENT_FLAVOR`); the shells' build scripts set their own `cfg(pkr_silice)` from it.
links = "pkr_content"

[dependencies]
engine.workspace = true

[build-dependencies]
extract.workspace = true
# Milestone 12: the dry runs that time the songs and cries (`build/sound.rs`).
sound.workspace = true
anyhow.workspace = true
# The Silice script registry (`build/silice/registry.rs`) parses `src/silice/scripts/*.rs`
# (already in the graph through serde and Dioxus).
syn = { version = "2", features = ["full"] }

[dev-dependencies]
extract.workspace = true
# `tests/m12_audio.rs` plays the sound blob through the software synth.
sound.workspace = true
anyhow.workspace = true
# `tests/sil1_w0_contracts.rs` includes the Silice build modules.
syn = { version = "2", features = ["full"] }
