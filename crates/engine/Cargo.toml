[package]
name = "engine"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# Always on (no feature): checkpoints are written on the GBA too, and agb's `agb_save` already
# compiles both crates in the ROM build (Milestone 5, decision 1).
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
# The RON golden of the checkpoint schema (`checkpoint/tests.rs`); the shells write RON.
ron = "0.8"
