[package]
name = "studio"
edition.workspace = true
version.workspace = true
publish.workspace = true

[features]
# The desktop app (`cargo run -p studio --features ui`); the core builds without a webview.
ui = ["dep:dioxus", "dep:dioxus-ssr", "dep:futures-channel", "dep:tokio"]

[dependencies]
engine.workspace = true
content.workspace = true
game-native.workspace = true
emu.workspace = true
extract.workspace = true
# The Explorer tab's core (`explorer.rs`): the explore db, read-only, and finding traces.
explore.workspace = true
anyhow.workspace = true
# Map tab pictures (already in the graph through `image`).
png = "0.18"
# The map editor's games dir files and edit scripts (SIL1 Task C; already in the graph through
# `extract`).
ron = "0.8"
serde = { version = "1", features = ["derive"] }
dioxus = { version = "0.7.10", features = ["desktop"], optional = true }
# The smoke timer's oneshot (already in Dioxus's tree).
futures-channel = { version = "0.3.34", optional = true }
# The UI's timers, on the runtime dioxus-desktop already runs (already in Dioxus's tree).
tokio = { version = "1.54.0", features = ["time"], optional = true }
# The display-free smoke test only (cfg(test) + ui).
dioxus-ssr = { version = "0.7.10", optional = true }

[dev-dependencies]
# Fault-injection games for finding fixtures (`explore::testing`).
explore = { workspace = true, features = ["testing"] }

[[bin]]
name = "studio"
required-features = ["ui"]

# The headless map editor (SIL1 Task C): `cargo xtask studio map …`.
[[bin]]
name = "studio-map"
path = "src/bin/studio_map.rs"
