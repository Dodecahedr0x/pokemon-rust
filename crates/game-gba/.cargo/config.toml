[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "thumbv4t-none-eabi"

[target.thumbv4t-none-eabi]
# No -Cforce-frame-pointers: the target spec keeps them already ("frame-pointer": "always";
# =yes and =no build the same bytes), and agb's backtrace, which walked them, is off.
rustflags = ["-Clink-arg=-Tgba.ld", "-Ctarget-cpu=arm7tdmi"]
