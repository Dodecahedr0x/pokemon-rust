[package]
name = "game-gba"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Without agb's `backtrace` and `testing` features: the shell has its own panic handler (it
# writes `DebugRegion::panicked`).
agb = { version = "0.25.0", default-features = false }
engine = { path = "../engine", features = ["iwram"] }
content = { path = "../content" }

[features]
# The map tour (Milestone 8 Task M): L+R+START warps to the next map (`src/tour_logic.rs`).
# ROM-only, built by `cargo xtask parity --long` into target/game-tour.gba.
tour = []

[profile.dev]
opt-level = 3
debug = true

[profile.release]
opt-level = 3
lto = "fat"
debug = true

# Milestone 8: the generated scripts are most of the code, and size-optimized they are 29% less
# `.text` (18% less ROM) and build in 30% less time and 43% less memory, within the frame budget
# (Wave 0 spike, plan "Wave 0 as built").
[profile.release.package.content]
opt-level = "s"
debug = false

# The content build script generates the data and the scripts: optimized, it runs 7x faster.
[profile.release.build-override]
opt-level = 3

[profile.dev.build-override]
opt-level = 3
