[package]
name = "explore"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
engine.workspace = true
content.workspace = true
# Decomp names (`names::MAPS` constants) for node export labels (Milestone 8 Task K).
extract.workspace = true
game-native.workspace = true
anyhow.workspace = true
rusqlite.workspace = true
serde = { version = "1", features = ["derive"] }
ron = "0.8"

[features]
# Fault-injection `GameData` wrappers (`explore::testing`), for tests only.
testing = []

[dev-dependencies]
tempfile = "3.27"
# Integration tests see `explore::testing`.
explore = { path = ".", features = ["testing"] }

[[bin]]
name = "explore"
path = "src/bin/explore.rs"
